<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛牛</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="my_photo.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { background: url('牛牛背景.jpg') no-repeat center center fixed; background-size: cover; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 50px 40px; border-radius: 15px; width: 380px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        h2 { color: white; margin-bottom: 40px; letter-spacing: 8px; }
        .input-group { position: relative; margin-bottom: 35px; border-bottom: 2px solid #8d6e63; display: flex; align-items: center; padding-bottom: 8px; }
        .input-group i { color: #bcaaa4; font-size: 22px; margin-right: 15px; }
        .input-group select, .input-group input { background: none; border: none; outline: none; color: white; font-size: 20px; width: 100%; }
        select option { background-color: #333; color: white; }
        .login-btn { width: 100%; padding: 12px; background-color: #8d6e63; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: #a1887f; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>LOGIN</h2>
    <form id="loginForm">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <select id="username">
                <option value="C1">C1</option>
                <option value="C2">C2</option>
                <option value="C3">C3</option>
                <option value="C4">C4</option>
                <option value="C5">C5</option>
                <option value="C6">C6</option>
                <option value="C7">C7</option>
            </select>
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" value="1234">
        </div>
        <button type="submit" class="login-btn">登 录</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (pass === "1234") {
            // 记住当前账号
            localStorage.setItem("nn_current_user", user);
            window.location.href = "牛牛.html"; 
        } else {
            alert("密码错误！");
        }
    });
</script>
</body>

</html>
